services:
  postgres:
    image: postgres:17-alpine
    container_name: worklingo-db
    environment:
      POSTGRES_USER: worklingo
      POSTGRES_PASSWORD: worklingo
      POSTGRES_DB: worklingo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklingo"]
      interval: 3s
      retries: 10
volumes:
  pgdata:
